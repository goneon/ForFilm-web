<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FrameFilm Pro - 信息墙效果预览</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    margin: 0;
    padding: 20px;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #eee;
}
h1 { margin: 0 0 6px 0; font-size: 22px; font-weight: 700; letter-spacing: 0.5px; background: linear-gradient(90deg, #2980b9, #27ae60); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
.desc { color: #888; font-size: 13px; margin-bottom: 22px; }
.epd-frame {
    background: linear-gradient(145deg, #2c2c3c, #222);
    padding: 18px;
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.08);
    display: inline-block;
}
.epd-screen {
    width: 792px;
    height: 528px;
    border-radius: 6px;
    position: relative;
    overflow: hidden;
    image-rendering: pixelated;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
.controls {
    margin-top: 22px;
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    background: rgba(255,255,255,0.04);
    padding: 16px 20px;
    border-radius: 12px;
    backdrop-filter: blur(10px);
}
.controls input, .controls select {
    padding: 9px 14px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.06);
    color: #eee;
    font-size: 14px;
    transition: all 0.15s ease;
}
.controls input:focus, .controls select:focus {
    outline: none;
    border-color: #2980b9;
    background: rgba(41, 128, 185, 0.1);
}
.controls label {
    font-size: 13px;
    color: #bbb;
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    padding: 4px 10px;
    border-radius: 6px;
    transition: background 0.15s;
}
.controls label:hover { background: rgba(255,255,255,0.06); }
.controls input[type="checkbox"] {
    width: 16px; height: 16px; accent-color: #27ae60;
}
.hint { margin-top: 16px; color: #888; font-size: 12px; }
@media (max-width: 850px) {
    .epd-frame { transform: scale(0.42); transform-origin: top center; margin-bottom: -300px; }
    .epd-screen { width: 792px; height: 528px; }
}
</style>
</head>
<body>
<h1>FrameFilm Pro · 信息墙 墨水屏预览</h1>
<div class="desc">792 × 528 px · 6 色电子纸调色板 · 模拟固件 framebuffer 渲染</div>

<div class="controls">
    <select id="previewStyle" onchange="render()">
        <option value="elegant" selected>✨ 优雅仪表盘（推荐）</option>
        <option value="classic">经典黑白</option>
        <option value="gradient">渐变标题栏</option>
        <option value="card">卡片式</option>
        <option value="pixel">像素风</option>
        <option value="dark">深色主题</option>
    </select>
    <select id="previewPage" onchange="render()">
        <option value="mc" selected>🎮 MC 服务器</option>
        <option value="ai">🤖 AI Token 余额</option>
        <option value="srv">📊 服务器监控</option>
    </select>
    <input type="text" id="mcHost" placeholder="服务器地址" value="mc.hypixel.net" oninput="render()" style="width:180px;">
    <label><input type="checkbox" id="showPlayers" checked onchange="render()"> 显示玩家头像</label>
</div>

<div class="epd-frame">
    <canvas id="screen" class="epd-screen" width="792" height="528"></canvas>
</div>

<div class="hint">顶部选择风格和页面，实时预览墨水屏效果 · 推荐「优雅仪表盘」风格</div>

<script>
// ===== 6 色调色板（与固件 hal_epd.c 对齐） =====
const PALETTE = {
    0x00: '#1a1a1a', // Black
    0x01: '#e8e4e0', // White (paper)
    0x02: '#d4a520', // Yellow
    0x03: '#c0392b', // Red
    0x05: '#2980b9', // Blue
    0x06: '#27ae60', // Green
};
const W = 792, H = 528;
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');

// ===== Renderer =====
const R = {
    ctx, W, H,
    clear(color) {
        this.ctx.fillStyle = (typeof color === 'number' ? (PALETTE[color] || PALETTE[0x01]) : color);
        this.ctx.fillRect(0, 0, this.W, this.H);
    },
    fillRect(x, y, w, h, color) {
        this.ctx.fillStyle = (typeof color === 'number' ? (PALETTE[color] || PALETTE[0x01]) : color);
        this.ctx.fillRect(x, y, w, h);
    },
    drawRect(x, y, w, h, color) {
        this.ctx.strokeStyle = (typeof color === 'number' ? (PALETTE[color] || PALETTE[0x01]) : color);
        this.ctx.lineWidth = 1;
        this.ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
    },
    drawHline(x, y, w, color) {
        this.ctx.fillStyle = (typeof color === 'number' ? (PALETTE[color] || PALETTE[0x01]) : color);
        this.ctx.fillRect(x, y, w, 1);
    },
    drawVline(x, y, h, color) {
        this.ctx.fillStyle = (typeof color === 'number' ? (PALETTE[color] || PALETTE[0x01]) : color);
        this.ctx.fillRect(x, y, 1, h);
    },
    drawText(x, y, s, color, bg, scale) {
        const sc = scale || 1;
        const c = (typeof color === 'number' ? (PALETTE[color] || PALETTE[0x01]) : color);
        this.ctx.font = (sc * 6.5) + 'px Consolas, "Courier New", monospace';
        this.ctx.textBaseline = 'top';
        if (bg !== undefined && bg !== null) {
            this.ctx.fillStyle = (typeof bg === 'number' ? (PALETTE[bg] || PALETTE[0x01]) : bg);
            const m = this.ctx.measureText(s);
            this.ctx.fillRect(x, y, m.width, sc * 8);
        }
        this.ctx.fillStyle = c; this.ctx.fillText(s, x, y);
    },
    drawTextCenter(cx, y, s, color, bg, scale) {
        const sc = scale || 1;
        this.ctx.font = (sc * 6.5) + 'px Consolas, "Courier New", monospace';
        this.ctx.textBaseline = 'top';
        const m = this.ctx.measureText(s);
        const x = cx - m.width / 2;
        if (bg !== undefined && bg !== null) {
            this.ctx.fillStyle = (typeof bg === 'number' ? (PALETTE[bg] || PALETTE[0x01]) : bg);
            this.ctx.fillRect(x, y, m.width, sc * 8);
        }
        this.ctx.fillStyle = (typeof color === 'number' ? (PALETTE[color] || PALETTE[0x01]) : color);
        this.ctx.fillText(s, x, y);
    },
    drawTextRight(rx, y, s, color, bg, scale) {
        const sc = scale || 1;
        this.ctx.font = (sc * 6.5) + 'px Consolas, "Courier New", monospace';
        this.ctx.textBaseline = 'top';
        const m = this.ctx.measureText(s);
        const x = rx - m.width;
        if (bg !== undefined && bg !== null) {
            this.ctx.fillStyle = (typeof bg === 'number' ? (PALETTE[bg] || PALETTE[0x01]) : bg);
            this.ctx.fillRect(x, y, m.width, sc * 8);
        }
        this.ctx.fillStyle = (typeof color === 'number' ? (PALETTE[color] || PALETTE[0x01]) : color);
        this.ctx.fillText(s, x, y);
    },
    measureText(s, scale) {
        const sc = scale || 1;
        this.ctx.font = (sc * 6.5) + 'px Consolas, "Courier New", monospace';
        return this.ctx.measureText(s).width;
    },
    drawBadge(x, y, txt, fg, bg) {
        const fgc = (typeof fg === 'number' ? (PALETTE[fg] || PALETTE[0x01]) : fg);
        const bgc = (typeof bg === 'number' ? (PALETTE[bg] || PALETTE[0x01]) : bg);
        this.ctx.font = '13px Consolas, "Courier New", monospace'; this.ctx.textBaseline = 'top';
        const m = this.ctx.measureText(txt);
        const pw = 12, ph = 4, bw = m.width + pw * 2, bh = 13 + ph * 2, r = 6;
        this.ctx.fillStyle = bgc;
        this.ctx.beginPath();
        this.ctx.moveTo(x + r, y); this.ctx.lineTo(x + bw - r, y);
        this.ctx.quadraticCurveTo(x + bw, y, x + bw, y + r);
        this.ctx.lineTo(x + bw, y + bh - r); this.ctx.quadraticCurveTo(x + bw, y + bh, x + bw - r, y + bh);
        this.ctx.lineTo(x + r, y + bh); this.ctx.quadraticCurveTo(x, y + bh, x, y + bh - r);
        this.ctx.lineTo(x, y + r); this.ctx.quadraticCurveTo(x, y, x + r, y);
        this.ctx.closePath(); this.ctx.fill();
        this.ctx.fillStyle = fgc; this.ctx.fillText(txt, x + pw, y + ph);
    },
    fillRoundRect(x, y, w, h, radius, color) {
        const c = (typeof color === 'number' ? (PALETTE[color] || PALETTE[0x01]) : color);
        const r = radius;
        this.ctx.fillStyle = c;
        this.ctx.beginPath();
        this.ctx.moveTo(x + r, y);
        this.ctx.lineTo(x + w - r, y);
        this.ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        this.ctx.lineTo(x + w, y + h - r);
        this.ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        this.ctx.lineTo(x + r, y + h);
        this.ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        this.ctx.lineTo(x, y + r);
        this.ctx.quadraticCurveTo(x, y, x + r, y);
        this.ctx.closePath(); this.ctx.fill();
    },
    drawRoundRect(x, y, w, h, radius, color) {
        const c = (typeof color === 'number' ? (PALETTE[color] || PALETTE[0x01]) : color);
        const r = radius;
        this.ctx.strokeStyle = c; this.ctx.lineWidth = 1;
        this.ctx.beginPath();
        this.ctx.moveTo(x + r, y + 0.5);
        this.ctx.lineTo(x + w - r, y + 0.5);
        this.ctx.quadraticCurveTo(x + w + 0.5, y + 0.5, x + w + 0.5, y + r);
        this.ctx.lineTo(x + w + 0.5, y + h - r);
        this.ctx.quadraticCurveTo(x + w + 0.5, y + h + 0.5, x + w - r, y + h + 0.5);
        this.ctx.lineTo(x + r, y + h + 0.5);
        this.ctx.quadraticCurveTo(x + 0.5, y + h + 0.5, x + 0.5, y + h - r);
        this.ctx.lineTo(x + 0.5, y + r);
        this.ctx.quadraticCurveTo(x + 0.5, y + 0.5, x + r, y + 0.5);
        this.ctx.closePath(); this.ctx.stroke();
    },
    fillCircle(cx, cy, r, color) {
        const c = (typeof color === 'number' ? (PALETTE[color] || PALETTE[0x01]) : color);
        this.ctx.fillStyle = c;
        this.ctx.beginPath(); this.ctx.arc(cx, cy, r, 0, Math.PI * 2); this.ctx.closePath(); this.ctx.fill();
    },
    drawAvatar(x, y, size, initial, color) {
        const c = (typeof color === 'number' ? (PALETTE[color] || PALETTE[0x01]) : color);
        const r = size / 2;
        this.ctx.fillStyle = c;
        this.ctx.beginPath(); this.ctx.arc(x + r, y + r, r, 0, Math.PI * 2); this.ctx.closePath(); this.ctx.fill();
        this.ctx.fillStyle = PALETTE[0x01];
        this.ctx.font = (size * 0.55) + 'px Consolas, monospace';
        this.ctx.textBaseline = 'middle'; this.ctx.textAlign = 'center';
        this.ctx.fillText(initial, x + r, y + r + 1);
        this.ctx.textAlign = 'left'; this.ctx.textBaseline = 'top';
    }
};

const MC_SAMPLE_PLAYERS = ["Steve", "Alex", "Notch", "Dream", "Phil", "Karl", "Luna", "Mika", "Nova", "Zed"];
const AVATAR_COLORS = [0x05, 0x06, 0x02, 0x03, 0x00, 0x05, 0x06, 0x02, 0x03, 0x05];

function formatTimestamp() {
    const d = new Date();
    return d.getFullYear() + '-' +
        String(d.getMonth() + 1).padStart(2, '0') + '-' +
        String(d.getDate()).padStart(2, '0') + ' ' +
        String(d.getHours()).padStart(2, '0') + ':' +
        String(d.getMinutes()).padStart(2, '0');
}

function drawPlayerAvatars(x, y, size, gap, darkMode) {
    const maxShow = 8;
    const count = Math.min(MC_SAMPLE_PLAYERS.length, maxShow);
    for (let i = 0; i < count; i++) {
        const ax = x + i * (size + gap);
        const initial = MC_SAMPLE_PLAYERS[i].charAt(0).toUpperCase();
        const color = AVATAR_COLORS[i % AVATAR_COLORS.length];
        R.drawAvatar(ax, y, size, initial, color);
    }
    if (MC_SAMPLE_PLAYERS.length > maxShow) {
        const extra = '+' + (MC_SAMPLE_PLAYERS.length - maxShow);
        R.drawText(x + count * (size + gap), y + size / 2 - 8, extra, darkMode ? 0x01 : 0x00, null, 2);
    }
}

// ===== 【推荐】MC 优雅仪表盘风格 =====
function renderMcElegant(mc, showPlayers) {
    const BLACK = 0x00, WHITE = 0x01, YELLOW = 0x02, RED = 0x03, BLUE = 0x05, GREEN = 0x06;

    R.clear(WHITE);

    // 边饰
    R.fillRect(0, 0, 792, 4, BLUE);
    R.fillRect(0, 8, 10, 60, GREEN);
    R.fillRect(0, 520, 792, 8, YELLOW);

    // 页码
    R.drawTextRight(776, 18, '1 / 2', BLACK, null, 2);
    R.fillRect(700, 42, 76, 2, BLUE);

    // 标题
    R.drawText(24, 18, 'MC  SERVER', BLACK, null, 4);
    R.drawText(24, 50, 'MINECRAFT  SERVICE  STATUS', BLUE, null, 1);

    // 状态徽章
    const statusColor = mc.status === 'ONLINE' ? GREEN : (mc.status === 'WAITING' ? YELLOW : RED);
    R.fillRoundRect(570, 16, 120, 34, 8, statusColor);
    R.drawTextCenter(630, 25, mc.status, WHITE, null, 2);
    R.fillCircle(588, 33, 4, WHITE);

    // 左侧核心：玩家数
    R.fillRect(90, 120, 10, 180, GREEN);
    const countOnline = String(mc.players_online);
    const countMax = ' / ' + mc.players_max;
    R.drawText(130, 130, countOnline, BLACK, null, 18);
    const bigW = R.measureText(countOnline, 18);
    R.drawText(130 + bigW + 6, 190, countMax, BLUE, null, 5);
    R.drawText(130, 300, '◆  PLAYERS  ONLINE', GREEN, null, 2);

    // 右侧信息卡
    R.fillRoundRect(480, 120, 260, 50, 6, BLUE);
    R.drawText(496, 132, 'HOST', WHITE, null, 2);
    R.drawRect(480, 170, 260, 60, BLUE);
    R.drawTextCenter(610, 190, mc.host, BLACK, null, 2);

    R.fillRoundRect(480, 250, 260, 50, 6, YELLOW);
    R.drawText(496, 262, 'VERSION', BLACK, null, 2);
    R.drawRect(480, 300, 260, 60, YELLOW);
    R.drawTextCenter(610, 320, 'v' + mc.version, BLACK, null, 2);

    // 中部装饰分割
    const decY = 395;
    R.fillCircle(396, decY, 6, BLUE);
    R.fillCircle(360, decY, 4, YELLOW);
    R.fillCircle(432, decY, 4, GREEN);
    R.fillCircle(324, decY, 3, RED);
    R.fillCircle(468, decY, 3, BLACK);
    R.drawHline(20, decY, 280, BLUE);
    R.drawHline(492, decY, 280, BLUE);

    // 底部玩家头像 / 时间
    if (showPlayers) {
        drawPlayerAvatars(24, 418, 44, 10, false);
        R.drawTextRight(776, 430, formatTimestamp(), BLUE, null, 2);
    } else {
        R.drawText(24, 430, '◆  ' + formatTimestamp(), BLACK, null, 2);
        R.drawTextRight(776, 430, 'FrameFilm  Pro', BLUE, null, 2);
    }

    // 右下角品牌
    R.fillRect(730, 490, 62, 24, BLACK);
    R.drawText(740, 498, 'Pro', WHITE, null, 2);
}

// ===== 【推荐】AI 优雅仪表盘风格 =====
function renderAiElegant(ai) {
    const BLACK = 0x00, WHITE = 0x01, YELLOW = 0x02, RED = 0x03, BLUE = 0x05, GREEN = 0x06;

    R.clear(WHITE);

    // -- 边饰：上下绿 --
    R.fillRect(0, 0, 792, 4, GREEN);
    R.fillRect(0, 520, 792, 8, GREEN);

    // -- 标题胶囊 --
    R.fillRoundRect(20, 18, 460, 42, 8, GREEN);
    R.drawText(36, 28, 'AI  ◆  ' + ai.label.toUpperCase(), WHITE, null, 3);

    // -- 状态徽章 --
    R.fillRoundRect(620, 20, 100, 30, 6, BLUE);
    R.fillCircle(636, 35, 3, WHITE);
    R.drawTextCenter(676, 28, ai.status, WHITE, null, 2);

    // -- 页码 --
    R.drawTextRight(776, 58, '2 / 2', BLACK, null, 2);

    // -- 核心余额（居中） --
    const balanceInt = Math.floor(ai.balance);
    const balanceDec = '.' + (ai.balance - balanceInt).toFixed(2).slice(2);
    const intStr = balanceInt.toLocaleString();

    const symW = R.measureText('¥', 6);
    const intW = R.measureText(intStr, 14);
    const decW = R.measureText(balanceDec, 6);
    const totalW = symW + 8 + intW + 6 + decW;
    const sx = Math.floor((792 - totalW) / 2);

    // 左侧蓝色竖条
    R.fillRect(sx - 26, 110, 6, 150, BLUE);

    // ¥ 符号（蓝色，底部对齐整数）
    const intBottom = 115 + 14 * 6.5;   // 整数底部 = 206
    const smY = Math.round(intBottom - 6 * 6.5); // 小字 y = 167
    R.drawText(sx, smY, '¥', BLUE, null, 6);
    // 整数部分（大黑字）
    R.drawText(sx + symW + 8, 115, intStr, BLACK, null, 14);
    // 小数部分（绿色，底部对齐整数）
    R.drawText(sx + symW + 8 + intW + 6, smY, balanceDec, GREEN, null, 6);

    // 余额标签
    R.drawTextCenter(396, 275, '◆  TOKEN  BALANCE', GREEN, null, 2);

    // -- 进度条 --
    const barX = 100, barW = 592, barY = 315;
    const ratio = Math.min(1, ai.balance / 5000);
    R.fillRoundRect(barX, barY, barW, 14, 3, BLACK);
    R.fillRoundRect(barX, barY, Math.max(14, Math.floor(barW * ratio)), 14, 3, GREEN);
    if (ratio > 0.02) {
        R.fillCircle(barX + Math.floor(barW * ratio), barY + 7, 10, YELLOW);
    }
    R.drawText(barX, barY + 22, '¥0', BLACK, null, 1);
    R.drawTextRight(barX + barW, barY + 22, '¥5,000', BLACK, null, 1);

    // -- 状态提示 --
    let tipColor = GREEN, tipText = '◆  BALANCE  OK';
    if (ai.balance < 100) { tipColor = RED; tipText = '!  LOW  BALANCE'; }
    else if (ai.balance < 500) { tipColor = YELLOW; tipText = '△  MEDIUM  BALANCE'; }
    R.drawTextCenter(396, 365, tipText, tipColor, null, 2);

    // -- 底部分割 --
    const decY2 = 415;
    R.drawHline(60, decY2, 300, GREEN);
    R.drawHline(432, decY2, 300, GREEN);
    R.fillCircle(396, decY2, 5, GREEN);
    R.fillCircle(366, decY2, 3, YELLOW);
    R.fillCircle(426, decY2, 3, BLUE);

    // -- 底部信息 --
    R.drawText(60, 445, formatTimestamp(), BLACK, null, 2);
    R.drawTextRight(732, 445, ai.label, BLUE, null, 2);

    // 品牌
    R.fillRect(720, 488, 60, 22, GREEN);
    R.drawText(730, 494, 'Pro', WHITE, null, 2);
}

// ===== 其他旧风格（保留切换） =====
function renderMcClassic(mc, showPlayers) {
    R.clear(0x01);
    R.fillRect(0, 0, 792, 60, 0x00);
    R.drawText(20, 18, 'MC SERVER', 0x01, null, 3);
    R.drawText(740, 22, '1/2', 0x01, null, 2);
    R.drawBadge(20, 75, mc.status, 0x01, mc.status === 'ONLINE' ? 0x06 : (mc.status === 'WAITING' ? 0x02 : 0x03));
    R.drawTextCenter(396, 160, mc.players_online + ' / ' + mc.players_max, 0x00, null, 8);
    R.drawTextCenter(396, 280, mc.host, 0x05, null, 2);
    R.drawTextCenter(396, 310, 'v' + mc.version, 0x00, null, 2);
    R.drawHline(20, 370, 752, 0x00);
    R.drawText(20, 390, formatTimestamp(), 0x00, null, 1);
    if (showPlayers) drawPlayerAvatars(20, 420, 40, 10, false);
}

function renderAiClassic(ai) {
    R.clear(0x01);
    R.fillRect(0, 0, 792, 60, 0x00);
    R.drawText(20, 18, 'AI - ' + ai.label, 0x01, null, 3);
    R.drawText(740, 22, '2/2', 0x01, null, 2);
    R.drawBadge(20, 75, ai.status, 0x01, 0x06);
    R.drawTextCenter(396, 170, ai.balance.toFixed(2), 0x00, null, 10);
    R.drawHline(20, 370, 752, 0x00);
    R.drawText(20, 390, formatTimestamp(), 0x00, null, 1);
}

function renderMcGradient(mc, showPlayers) {
    renderMcClassic(mc, showPlayers);
    // 标题栏渐变效果
    for (let i = 0; i < 792; i++) {
        const t = i / 792;
        const frac = t < 0.5 ? t / 0.5 : (t - 0.5) / 0.5;
        const c1 = t < 0.5 ? PALETTE[0x00] : PALETTE[0x05];
        const c2 = t < 0.5 ? PALETTE[0x05] : PALETTE[0x00];
        const r = Math.round(parseInt(c1.slice(1,3),16)*(1-frac) + parseInt(c2.slice(1,3),16)*frac);
        const g = Math.round(parseInt(c1.slice(3,5),16)*(1-frac) + parseInt(c2.slice(3,5),16)*frac);
        const b = Math.round(parseInt(c1.slice(5,7),16)*(1-frac) + parseInt(c2.slice(5,7),16)*frac);
        R.fillRect(i, 0, 1, 60, 'rgb('+r+','+g+','+b+')');
    }
    R.drawText(20, 18, 'MC SERVER', 0x01, null, 3);
    R.drawText(740, 22, '1/2', 0x01, null, 2);
}

function renderMcCard(mc, showPlayers) {

    R.drawText(720, 52, '1/2', 0x01, null, 2);
    R.drawBadge(50, 105, mc.status, 0x01, mc.status === 'ONLINE' ? 0x06 : 0x03);
    R.drawTextCenter(396, 190, mc.players_online + ' / ' + mc.players_max, 0x00, null, 8);

    R.drawTextCenter(396, 340, 'v' + mc.version, 0x00, null, 2);

}

function renderMcPixel(mc, showPlayers) {
    R.clear(0x01);
    const bw = 2;
    for (let i = 0; i < 792; i += bw*2) {
        const c1 = ((i/(bw*2)) & 1) ? 0x02 : 0x00;
        const c2 = ((i/(bw*2)) & 1) ? 0x00 : 0x02;
        R.fillRect(i, 0, bw, bw, c1); R.fillRect(i+bw, 0, bw, bw, c2);
        R.fillRect(i, 528-bw, bw, bw, c2); R.fillRect(i+bw, 528-bw, bw, bw, c1);
    }
    for (let j = 0; j < 528; j += bw*2) {
        const c1 = ((j/(bw*2)) & 1) ? 0x02 : 0x00;
        const c2 = ((j/(bw*2)) & 1) ? 0x00 : 0x02;
        R.fillRect(0, j, bw, bw, c1); R.fillRect(0, j+bw, bw, bw, c2);
        R.fillRect(792-bw, j, bw, bw, c2); R.fillRect(792-bw, j+bw, bw, bw, c1);
    }
    R.fillRect(10, 10, 772, 60, 0x00);
    R.drawText(30, 28, 'MC SERVER', 0x01, null, 3);
    R.drawText(730, 32, '1/2', 0x01, null, 2);
    R.drawBadge(30, 85, mc.status, 0x01, mc.status === 'ONLINE' ? 0x06 : 0x03);
    R.drawTextCenter(396, 170, mc.players_online + ' / ' + mc.players_max, 0x00, null, 8);
    R.drawTextCenter(396, 290, mc.host, 0x05, null, 2);
    R.drawTextCenter(396, 320, 'v' + mc.version, 0x00, null, 2);
    R.drawHline(30, 380, 732, 0x00);
    R.drawText(30, 400, formatTimestamp(), 0x00, null, 1);
    if (showPlayers) drawPlayerAvatars(30, 430, 36, 8, false);
}

function renderMcDark(mc, showPlayers) {
    R.clear(0x00);
    R.fillRect(0, 0, 792, 60, 0x01);
    R.drawText(20, 18, 'MC SERVER', 0x00, null, 3);
    R.drawText(740, 22, '1/2', 0x00, null, 2);
    R.drawBadge(20, 75, mc.status, 0x01, mc.status === 'ONLINE' ? 0x06 : 0x03);

    R.drawTextCenter(396, 310, 'v' + mc.version, 0x01, null, 2);
    R.drawHline(20, 370, 752, 0x05);
    R.drawText(20, 390, formatTimestamp(), 0x01, null, 1);
    if (showPlayers) drawPlayerAvatars(20, 420, 40, 10, true);
}

function renderAiGradient(ai) {
    renderAiClassic(ai);
    for (let i = 0; i < 792; i++) {
        const t = i / 792;
        const frac = t < 0.5 ? t / 0.5 : (t - 0.5) / 0.5;
        const c1 = t < 0.5 ? PALETTE[0x00] : PALETTE[0x05];
        const c2 = t < 0.5 ? PALETTE[0x05] : PALETTE[0x00];
        const r = Math.round(parseInt(c1.slice(1,3),16)*(1-frac) + parseInt(c2.slice(1,3),16)*frac);
        const g = Math.round(parseInt(c1.slice(3,5),16)*(1-frac) + parseInt(c2.slice(3,5),16)*frac);
        const b = Math.round(parseInt(c1.slice(5,7),16)*(1-frac) + parseInt(c2.slice(5,7),16)*frac);
        R.fillRect(i, 0, 1, 60, 'rgb('+r+','+g+','+b+')');
    }
    R.drawText(20, 18, 'AI - ' + ai.label, 0x01, null, 3);
    R.drawText(740, 22, '2/2', 0x01, null, 2);
}

function renderAiCard(ai) {
    R.clear(0x01);
    R.drawRect(30, 30, 732, 468, 0x00);
    R.fillRect(30, 30, 732, 60, 0x00);
    R.drawText(50, 48, 'AI - ' + ai.label, 0x01, null, 3);
    R.drawText(720, 52, '2/2', 0x01, null, 2);
    R.drawBadge(50, 105, ai.status, 0x01, 0x06);
    R.drawTextCenter(396, 200, ai.balance.toFixed(2), 0x00, null, 10);
    R.drawHline(50, 400, 692, 0x00);
    R.drawText(50, 420, formatTimestamp(), 0x00, null, 1);
}

function renderAiPixel(ai) {
    R.clear(0x01);
    const bw = 2;
    for (let i = 0; i < 792; i += bw*2) {
        const c1 = ((i/(bw*2)) & 1) ? 0x02 : 0x00;
        const c2 = ((i/(bw*2)) & 1) ? 0x00 : 0x02;
        R.fillRect(i, 0, bw, bw, c1); R.fillRect(i+bw, 0, bw, bw, c2);
        R.fillRect(i, 528-bw, bw, bw, c2); R.fillRect(i+bw, 528-bw, bw, bw, c1);
    }
    for (let j = 0; j < 528; j += bw*2) {
        const c1 = ((j/(bw*2)) & 1) ? 0x02 : 0x00;
        const c2 = ((j/(bw*2)) & 1) ? 0x00 : 0x02;
        R.fillRect(0, j, bw, bw, c1); R.fillRect(0, j+bw, bw, bw, c2);
        R.fillRect(792-bw, j, bw, bw, c2); R.fillRect(792-bw, j+bw, bw, bw, c1);
    }
    R.fillRect(10, 10, 772, 60, 0x00);
    R.drawText(30, 28, 'AI - ' + ai.label, 0x01, null, 3);
    R.drawText(730, 32, '2/2', 0x01, null, 2);
    R.drawBadge(30, 85, ai.status, 0x01, 0x06);
    R.drawTextCenter(396, 180, ai.balance.toFixed(2), 0x00, null, 10);
    R.drawHline(30, 380, 732, 0x00);
    R.drawText(30, 400, formatTimestamp(), 0x00, null, 1);
}

function renderAiDark(ai) {
    R.clear(0x00);
    R.fillRect(0, 0, 792, 60, 0x01);
    R.drawText(20, 18, 'AI - ' + ai.label, 0x00, null, 3);
    R.drawText(740, 22, '2/2', 0x00, null, 2);
    R.drawBadge(20, 75, ai.status, 0x01, 0x06);
    R.drawTextCenter(396, 170, ai.balance.toFixed(2), 0x02, null, 10);

}

// ===== 服务器监控渲染 =====
function renderSrvElegant(srv) {
    const BLACK = 0x00, WHITE = 0x01, YELLOW = 0x02, RED = 0x03, BLUE = 0x05, GREEN = 0x06;
    R.clear(WHITE);
    R.fillRect(0, 0, 792, 4, RED);
    R.fillRect(0, 520, 792, 8, RED);
    R.fillRoundRect(20, 18, 460, 42, 8, BLUE);
    R.drawText(36, 28, 'SRV  ◆  ' + srv.label.toUpperCase(), WHITE, null, 3);
    R.fillRoundRect(620, 20, 100, 30, 6, GREEN);
    R.fillCircle(636, 35, 3, WHITE);
    R.drawTextCenter(676, 28, srv.status, WHITE, null, 2);
    R.drawTextRight(776, 58, '3 / 3', BLACK, null, 2);

    const cards = [
        { label: 'CPU',    value: srv.cpu + '%',         ratio: srv.cpu / 100,       color: BLUE,   x: 30,  y: 90 },
        { label: 'MEM',    value: srv.mem + '%',         ratio: srv.mem / 100,       color: GREEN,  x: 410, y: 90 },
        { label: 'DISK',   value: srv.disk + '%',        ratio: srv.disk / 100,      color: YELLOW, x: 30,  y: 235 },
        { label: 'NET UP', value: srv.netUp + ' MB/s',   ratio: Math.min(1, srv.netUp / 10),  color: RED,    x: 410, y: 235 },
        { label: 'NET DL', value: srv.netDown + ' MB/s', ratio: Math.min(1, srv.netDown / 20), color: BLUE,   x: 30,  y: 380 },
        { label: 'UPTIME', value: srv.uptime,            ratio: 0,                   color: GREEN,  x: 410, y: 380 }
    ];
    cards.forEach(function(c) {
        const cw = 352;
        R.fillRoundRect(c.x, c.y, cw, 30, 5, c.color);
        R.drawText(c.x + 12, c.y + 8, c.label, WHITE, null, 2);
        R.drawText(c.x + 12, c.y + 42, c.value, BLACK, null, 4);
        if (c.ratio > 0) {
            const barX = c.x + 12, barY = c.y + 92, barW = cw - 24;
            R.fillRoundRect(barX, barY, barW, 12, 3, BLACK);
            var fillW = Math.max(12, Math.floor(barW * c.ratio));
            var barColor = c.color;
            if (c.ratio > 0.85) barColor = RED;
            else if (c.ratio > 0.7) barColor = YELLOW;
            R.fillRoundRect(barX, barY, fillW, 12, 3, barColor);
        }
    });
    R.fillRect(720, 488, 60, 22, RED);
    R.drawText(730, 494, 'Pro', WHITE, null, 2);
}

function renderSrvClassic(srv) {
    R.clear(0x01);
    R.fillRect(0, 0, 792, 60, 0x00);
    R.drawText(20, 18, 'SRV - ' + srv.label, 0x01, null, 3);
    R.drawText(740, 22, '3/3', 0x01, null, 2);
    R.drawBadge(20, 75, srv.status, 0x01, 0x06);
    var rows = [
        { l: 'CPU',       v: srv.cpu + '%' },
        { l: 'MEMORY',    v: srv.mem + '%' },
        { l: 'DISK',      v: srv.disk + '%' },
        { l: 'NET UP',    v: srv.netUp + ' MB/s' },
        { l: 'NET DOWN',  v: srv.netDown + ' MB/s' },
        { l: 'UPTIME',    v: srv.uptime }
    ];
    rows.forEach(function(r, i) {
        var y = 110 + i * 60;
        R.drawText(30, y, r.l, 0x00, null, 2);
        R.drawTextRight(762, y, r.v, 0x05, null, 2);
        R.drawHline(30, y + 28, 732, 0x00);
    });
}

function renderSrvDark(srv) {
    R.clear(0x00);
    R.fillRect(0, 0, 792, 60, 0x01);
    R.drawText(20, 18, 'SRV - ' + srv.label, 0x00, null, 3);
    R.drawText(740, 22, '3/3', 0x00, null, 2);
    R.drawBadge(20, 75, srv.status, 0x01, 0x06);
    var rows = [
        { l: 'CPU',       v: srv.cpu + '%',         c: 0x05 },
        { l: 'MEMORY',    v: srv.mem + '%',         c: 0x06 },
        { l: 'DISK',      v: srv.disk + '%',        c: 0x02 },
        { l: 'NET UP',    v: srv.netUp + ' MB/s',   c: 0x03 },
        { l: 'NET DOWN',  v: srv.netDown + ' MB/s', c: 0x05 },
        { l: 'UPTIME',    v: srv.uptime,            c: 0x06 }
    ];
    rows.forEach(function(r, i) {
        var y = 110 + i * 60;
        R.drawText(30, y, r.l, 0x01, null, 2);
        R.drawTextRight(762, y, r.v, r.c, null, 2);
        R.drawHline(30, y + 28, 732, 0x05);
    });
}

// ===== 主渲染 =====
function render() {
    const style = document.getElementById('previewStyle').value;
    const page = document.getElementById('previewPage').value;
    const showPlayers = document.getElementById('showPlayers').checked;
    const host = document.getElementById('mcHost').value || 'mc.example.com';

    if (page === 'mc') {
        const mc = { host: host, status: 'ONLINE', players_online: 5, players_max: 20, version: '1.21.1' };
        if (style === 'classic') renderMcClassic(mc, showPlayers);
        else if (style === 'gradient') renderMcGradient(mc, showPlayers);
        else if (style === 'card') renderMcCard(mc, showPlayers);
        else if (style === 'pixel') renderMcPixel(mc, showPlayers);
        else if (style === 'dark') renderMcDark(mc, showPlayers);
        else renderMcElegant(mc, showPlayers);
    } else if (page === 'ai') {
        const ai = { label: 'DeepSeek', status: 'OK', balance: 1245.80 };
        if (style === 'classic') renderAiClassic(ai);
        else if (style === 'gradient') renderAiGradient(ai);
        else if (style === 'card') renderAiCard(ai);
        else if (style === 'pixel') renderAiPixel(ai);
        else if (style === 'dark') renderAiDark(ai);
        else renderAiElegant(ai);
    } else {
        const srv = { label: 'My Server', status: 'ONLINE', cpu: 42, mem: 68, disk: 55, netUp: 1.2, netDown: 8.5, uptime: '14d 6h' };
        if (style === 'dark') renderSrvDark(srv);
        else if (style === 'classic') renderSrvClassic(srv);
        else renderSrvElegant(srv);
    }
}

render();
</script>
